# macOS 上でセットアップ用ファイルの構文を確認する。
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2

      - name: Check shell and Brewfile syntax
        run: |
          zsh -n .zprofile
          zsh -n .zshrc
          for script in init.sh homebrew/setup.sh node/setup.sh mac/setup.sh; do
            bash -n "$script" || exit 1
          done
          ruby -c homebrew/Brewfile
